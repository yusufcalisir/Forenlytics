<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forenlytics Loading</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #0F172A 0%, #030712 100%);
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
    }
    .container {
      text-align: center;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #F8FAFC;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 11px;
      color: #94A3B8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    /* Waveform Animation */
    .wave-bars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 36px;
      margin-bottom: 28px;
    }
    .bar {
      width: 4px;
      background: linear-gradient(to top, #0284C7, #38BDF8);
      border-radius: 2px;
      animation: wave 1.2s ease-in-out infinite alternate;
    }
    .bar:nth-child(1) { height: 12px; animation-delay: 0.1s; }
    .bar:nth-child(2) { height: 24px; animation-delay: 0.2s; }
    .bar:nth-child(3) { height: 36px; animation-delay: 0.3s; }
    .bar:nth-child(4) { height: 18px; animation-delay: 0.4s; }
    .bar:nth-child(5) { height: 30px; animation-delay: 0.5s; }
    .bar:nth-child(6) { height: 22px; animation-delay: 0.6s; }
    .bar:nth-child(7) { height: 34px; animation-delay: 0.7s; }
    .bar:nth-child(8) { height: 14px; animation-delay: 0.8s; }

    @keyframes wave {
      0% { transform: scaleY(0.3); opacity: 0.4; }
      100% { transform: scaleY(1); opacity: 1; filter: drop-shadow(0 0 6px #38BDF8); }
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 14px;
      position: relative;
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #0284C7, #38BDF8, #818CF8);
      border-radius: 2px;
      animation: slideProgress 1.6s infinite cubic-bezier(0.65, 0, 0.35, 1);
    }
    @keyframes slideProgress {
      0% { left: -40%; }
      100% { left: 100%; }
    }

    .status-text {
      font-size: 12px;
      color: #38BDF8;
      font-weight: 500;
      min-height: 18px;
    }
    .footer-tag {
      position: absolute;
      bottom: 14px;
      font-size: 10px;
      color: #475569;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap" style="width: 76px; height: 76px; margin: 0 auto 16px auto;">
      <img src="logo.svg" alt="Forenlytics" style="width: 100%; height: 100%; filter: drop-shadow(0 0 16px rgba(0, 240, 255, 0.45));" />
    </div>
    <h1>Forenlytics</h1>
    <div class="subtitle">Forensic Audio & Deepfake Detection Platform</div>

    <div class="wave-bars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>

    <div id="status-text" class="status-text">Initializing Forensic Engine & AI Models...</div>
  </div>

  <div class="footer-tag">v2.0.0 &bull; Standalone Air-Gapped Edition</div>

  <script>
    const messages = [
      "Initializing Forensic Audio Core...",
      "Verifying SpeechBrain ECAPA-TDNN Models...",
      "Loading WavLM-SV Biometric Speaker Engine...",
      "Initializing Wav2Vec2 Synthetic Speech Detector...",
      "Establishing Local Interface Connection..."
    ];
    let idx = 0;
    const el = document.getElementById("status-text");
    setInterval(() => {
      idx = (idx + 1) % messages.length;
      el.innerText = messages[idx];
    }, 2200);
  </script>
</body>
</html>
