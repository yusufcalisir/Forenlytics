# ==============================================================================
# Forenlytics Audio Forensics - Air-Gapped Production Docker Compose
# ==============================================================================
# For offline air-gapped forensic labs and local standalone workstations.
# Run 'install.bat' (Windows) or 'install.sh' (Linux) for one-click setup.
# ==============================================================================

services:
  backend:
    image: forenlytics-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forenlytics-backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HOME=/app/models/huggingface
      - TRANSFORMERS_CACHE=/app/models/huggingface/hub
      - SPEECHBRAIN_CACHE_DIR=/app/models/speechbrain
      - TORCH_HOME=/app/models/torch
      - PORT=8000
    volumes:
      - ./models/speechbrain:/app/models/speechbrain:ro
      - ./models/huggingface:/app/models/huggingface:ro
      - ./backend/speechbrain_cache:/app/speechbrain_cache:ro
      - ./data/sessions:/app/data/sessions
      - ./data/reports:/app/data/reports
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - forenlytics-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    image: forenlytics-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forenlytics-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - forenlytics-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  forenlytics-net:
    driver: bridge
